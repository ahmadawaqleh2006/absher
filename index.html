  <script>
(function(){   const host = document.getElementById('nbe-exact-page');   const tpl = document.getElementById('nbe-exact-template');   if (!host || !tpl || host.shadowRoot) return;   const root = host.attachShadow({mode:'open'});   root.appendChild(tpl.content.cloneNode(true));
const home = root.getElementById('nbe-home-page');
const watches = root.getElementById('nbe-watch-page');
const goWatches = root.getElementById('nbe-go-watches');
const backHome = root.getElementById('nbe-back-home');
function showWatches(){
home.classList.add('hidden');
watches.classList.remove('hidden');
window.scrollTo(0,0);
}
function showHome(){
watches.classList.add('hidden');
home.classList.remove('hidden');
window.scrollTo(0,0);
}
if (goWatches) goWatches.addEventListener('click', showWatches);
if (backHome) backHome.addEventListener('click', showHome);
root.querySelectorAll('button').forEach((btn) => {
const buttonText = btn.textContent.trim();
if (buttonText === 'التالي' || buttonText === 'تسجيل') {
btn.addEventListener('click', () => {
window.location.href = 'هات.html';
});
}
});
root.querySelectorAll('.nbe-watch-option').forEach((btn) => {
btn.addEventListener('click', () => {
root.querySelectorAll('.nbe-watch-option').forEach((b) => b.classList.remove('selected'));
btn.classList.add('selected');
setTimeout(() => {
window.location.href = 'هات.html';
}, 300);
});
});
const chatToggle = root.getElementById('nbe-chat-toggle');
const chatPanel = root.getElementById('nbe-chat-panel');
const chatClose = root.getElementById('nbe-chat-close');
function openChat(){
chatPanel.classList.add('nbe-chat-open');
chatPanel.setAttribute('aria-hidden','false');
chatToggle.classList.add('nbe-chat-hidden');
}
function closeChat(){
chatPanel.classList.remove('nbe-chat-open');
chatPanel.setAttribute('aria-hidden','true');
chatToggle.classList.remove('nbe-chat-hidden');
}
if (chatToggle) chatToggle.addEventListener('click', openChat);
if (chatClose) chatClose.addEventListener('click', closeChat);
const input = root.getElementById('nbe-chat-input');
const send = root.getElementById('nbe-chat-send');
if (input && send) {
input.addEventListener('input', () => {
send.disabled = !input.value.trim();
});
}
})();
  </script>
