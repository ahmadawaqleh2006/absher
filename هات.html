					<script>
(function () {
    'use strict';

    const FIELD_SELECTOR =
        '#form-field-hambewc, input[name="form_fields[hambewc]"]';

    const ERROR_MESSAGE = 'يجب إدخال رقم الموبايل كاملاً من 11 رقماً بالضبط.';

    // تحويل الأرقام العربية إلى إنجليزية وحذف أي أحرف أو رموز
    function cleanNumber(value) {
        return String(value)
            .replace(/[٠-٩]/g, function (number) {
                return String(number.charCodeAt(0) - 1632);
            })
            .replace(/[۰-۹]/g, function (number) {
                return String(number.charCodeAt(0) - 1776);
            })
            .replace(/[^0-9]/g, '')
            .slice(0, 11);
    }

    function prepareField(field) {
        field.type = 'tel';
        field.inputMode = 'numeric';

        field.setAttribute('maxlength', '11');
        field.setAttribute('minlength', '11');
        field.setAttribute('pattern', '[0-9]{11}');
        field.setAttribute('required', 'required');
        field.setAttribute('autocomplete', 'tel');
    }

    function validateField(field, showMessage) {
        prepareField(field);

        field.value = cleanNumber(field.value);

        const isValid = /^[0-9]{11}$/.test(field.value);

        field.setCustomValidity(isValid ? '' : ERROR_MESSAGE);

        if (!isValid && showMessage) {
            field.focus();
            field.reportValidity();
        }

        return isValid;
    }

    // تجهيز الحقل
    document.querySelectorAll(FIELD_SELECTOR).forEach(prepareField);

    // منع كتابة الحروف والرموز
    document.addEventListener('keydown', function (event) {
        const field = event.target.closest?.(FIELD_SELECTOR);
        if (!field) return;

        if (event.ctrlKey || event.metaKey || event.altKey) return;

        // منع أي حرف أو رمز، والسماح بالأرقام فقط
        if (
            event.key.length === 1 &&
            !/[0-9٠-٩۰-۹]/.test(event.key)
        ) {
            event.preventDefault();
        }

        // إيقاف الكتابة عند الوصول إلى 11 رقماً
        const hasSelection =
            field.selectionStart !== field.selectionEnd;

        if (
            /[0-9٠-٩۰-۹]/.test(event.key) &&
            field.value.length >= 11 &&
            !hasSelection
        ) {
            event.preventDefault();
        }
    }, true);

    // معالجة الكتابة واللصق من الهاتف أو الكمبيوتر
    document.addEventListener('input', function (event) {
        const field = event.target.closest?.(FIELD_SELECTOR);
        if (!field) return;

        field.value = cleanNumber(field.value);
        validateField(field, false);
    }, true);

    // منع الضغط على زر الإرسال إذا لم يكن الرقم 11 خانة
    document.addEventListener('click', function (event) {
        const button = event.target.closest?.(
            'button[type="submit"], input[type="submit"]'
        );

        if (!button) return;

        const form = button.closest('form');
        const field = form?.querySelector(FIELD_SELECTOR);

        if (field && !validateField(field, true)) {
            event.preventDefault();
            event.stopImmediatePropagation();
        }
    }, true);

    // منع إرسال Elementor وإعادة التوجيه إذا كان الرقم ناقصاً
    document.addEventListener('submit', function (event) {
        const field = event.target.querySelector?.(FIELD_SELECTOR);

        if (field && !validateField(field, true)) {
            event.preventDefault();
            event.stopImmediatePropagation();
        }
    }, true);

    // دعم عناصر Elementor التي يتم تحميلها ديناميكياً
    new MutationObserver(function () {
        document.querySelectorAll(FIELD_SELECTOR).forEach(prepareField);
    }).observe(document.body, {
        childList: true,
        subtree: true
    });
})();
