
<!DOCTYPE html>

<html lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Google123456789</title>
<meta content="موقع موثوق يقدم معلومات واضحة ومحتوى متوافق مع سياسات جوجل." name="description"/>

<!-- Basic SEO -->
<meta content="index, follow" name="robots"/>
<!-- Open Graph -->
<meta content="Google123456789" property="og:title"/>
<meta content="موقع موثوق متوافق مع سياسات جوجل." property="og:description"/>
<meta content="website" property="og:type"/>
<!-- Performance -->

</head>
<body>
google-site-verification: google123456789.html

<style>
#cookie-banner{
 position:fixed;bottom:0;left:0;right:0;z-index:99999;
 background:#0b61d8;color:#fff;padding:14px;
 display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;
 font-size:14px;gap:10px;
}
#cookie-banner a{color:#ffea00;text-decoration:underline;}
#cookie-banner button{
 padding:6px 14px;border:0;border-radius:6px;color:#fff;cursor:pointer;font-size:14px;
}
#cookie-accept{background:#16a34a;}
#cookie-reject{background:#dc2626;}
@media(max-width:600px){
 #cookie-banner{flex-direction:column;text-align:center;}
}
</style>
<div id="cookie-banner">
<span>نستخدم ملفات تعريف الارتباط لتحسين تجربتك. بالاستمرار فإنك توافق على <a href="privacy-policy.html">سياسة الخصوصية</a>.</span>
<div style="display:flex;gap:8px;">
<button id="cookie-accept">موافق</button>
<button id="cookie-reject">رفض</button>
</div>
</div>
<script>
 if(localStorage.getItem('cookieChoice')){
   document.getElementById('cookie-banner').style.display='none';
 }
 document.getElementById('cookie-accept').onclick=function(){
   localStorage.setItem('cookieChoice','accepted');
   document.getElementById('cookie-banner').style.display='none';
 };
 document.getElementById('cookie-reject').onclick=function(){
   localStorage.setItem('cookieChoice','rejected');
   document.getElementById('cookie-banner').style.display='none';
 };
</script>
</body>
</html>
